services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lumina_root_dev}
      MYSQL_DATABASE: lumina_pms
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-lumina_root_dev}@db:3306/lumina_pms
    depends_on:
      - db

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-lumina_root_dev}@db:3306/lumina_pms
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 48)}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?set AUTH_ENCRYPTION_KEY (openssl rand -hex 32)}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?set INTEGRATION_ENCRYPTION_KEY (openssl rand -hex 32)}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysqldata:
